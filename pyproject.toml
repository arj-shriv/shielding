[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "shielding-ml"
version = "0.1.0"
description = "1D CNN surrogate model for neutron shielding — Ca-48 150 MeV/n"
requires-python = ">=3.9"
dependencies = [
    "numpy",
    "scipy",
    "matplotlib",
    "tensorflow",
    "scikit-learn",
]

[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
dev = ["pytest", "pytest-cov"]
